[WBP_InteractablePrompt]              ; "hold E to ..." in the world
opacity = game   ; the game hides this prompt by fading it out; an absolute value here or in [All] keeps it on screen after you walk away
scale = 0.7
[WBP_InteractablePrompt_AbilityVariant]
opacity = game   ; same as above
scale = 0.7
; The prompts' OPACITY, done the only way that survives the game's own fade-in/out: on the widget
; directly under the prompt rather than the prompt itself. The game animates the root's opacity
; (0 hidden, 1 shown); opacity multiplies down the tree, so root x 0.8 is exactly "0.8 when shown,
; gone when hidden". "/*" = whatever single widget sits directly under that root.
[WBP_InteractablePrompt/*]
opacity = 0.6
scale = 1
[WBP_InteractablePrompt_AbilityVariant/*]
opacity = 0.6
scale = 1
; [WBP_HUD_LootingPanel]   ; the loot list


; ---- dialogue and subtitles ------------------------------------------------------------------
; The game fades the choice box out after you pick an option. An absolute opacity on the box
; itself would keep putting it back, so the box's opacity stays the game's and the dimming goes
; on the widget directly under it - root x 0.8 = 0.8 while it is up, gone when the game hides it.
[WBP_Dialogue_ChoiceBox]               ; the dialogue options (one WBP_Dialogue_ChoiceBox_Line per option)
scale = 0.9
opacity = game
[WBP_Dialogue_ChoiceBox/*]
opacity = 0.8
scale = 1

; The tutorial card. It animates itself in, so a plain opacity is overwritten by its own show
; animation - force re-pushes it. If this section does nothing, the card is a different widget:
; press F9 while it is on screen and look for the class in UE4SS.log.
[WBP_MediumTutorialPopup]
opacity = 0.8
force = true

