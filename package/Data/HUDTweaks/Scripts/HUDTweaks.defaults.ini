; Legacy import defaults only. Use Mod Settings, Apply, then restart.
; ===========================================================================================
; HUDTweaks - The Blood of Dawnwalker
;
; Move, resize, recolour and fade HUD elements, and fade the whole HUD out while nothing is
; happening. Edit this file, press F7 in game to apply.
; F8 turns every tweak off and on again, to compare against the untouched HUD.
;
; Out of the box only ONE thing is on: the auto-fade, down at [AutoFade], because that is the
; part you cannot get any other way. Every element section below is commented out.
;
; Values: true/false, a number, or blank to leave the game's own value alone.
; ; or # starts a comment, on its own line or after a value or a section header:
;     [Crosshair]     ; the crosshair
;     scale = 0.7     ; a bit smaller
; Anything else after a ] is not a comment and the whole line is ignored - the log lists every
; line it could not understand, so check there first if a section seems to do nothing.
; ===========================================================================================


[General]
reassertSeconds = 5.0

enabled          = true       ; false = the HUD is untouched
startImmediately = true       ; apply on load instead of waiting for a level change
debugLogging        = false       ; extra console output - LEAVE ON until the shadowstep question is settled

reloadKey        = F7         ; re-read this file and apply
toggleKey        = F8         ; all tweaks off / on
scanKey          = F9         ; list EVERY live widget in UE4SS.log, with its class path.
                              ; Open the screen you want first, then press it - this is how you
                              ; find anything not named below.

dumpWidgets      = false      ; list every HUD element in UE4SS.log - turn on to find names
dumpOnlyManaged  = false      ; cut that list down to only what this file configures
dumpMaxDepth     = 8          ; how deep the list goes. 0 = everything

; Run the mod's WRITERS - the fade's ease steps, the 2s re-check, the force loop - on the game
; thread (ExecuteInGameThreadWithDelay) instead of UE4SS's own thread. Widget writes from another
; thread race the engine and can fault inside UE4SS.dll, which shows up as a plain crash with no
; log line before it. The probes and the heavy passes stay on UE4SS's thread either way. (An
; earlier try put everything on the game thread while a step still cost 146ms - that was the
; stutter; a step is 0.5ms now.) Turn off only to test whether a crash is this mod's.
gameThreadTimers = true

; Log EVERY write to these elements: who wrote (recheck / hook / force / fade), what the game had
; put there just before, what we set, the parent, and whether one of its animations is running.
; For the one element you are fighting the game over. Blank to turn off.
trace            =   ; e.g. WBP_HudTimer, WBP_InteractablePrompt/*  (blank = off; it logs a line per write)


; ---- WHAT THIS MOD LOOKS AT ------------------------------------------------------------------
; Dawnwalker keeps its whole HUD in ONE widget - WBP_GameHUD - with about sixty named children
; inside it. That is the first entry below, and it is the one that matters: [WBP_GameHUD] means
; the whole HUD, and every name in the reference further down is a child of it.
;
; The rest of the list is the handful of things the game creates OUTSIDE that widget while you
; play - a compass pin per marker, a toast per notification, a target indicator per enemy. They
; come and go by the dozen, which is why this mod writes your values onto the CLASS as well as
; onto live widgets: a pin that only exists for two seconds is born with your settings already
; applied rather than waiting for a timer to catch it.
;
; Uncomment and edit to change the list. Full class paths are wanted here, not short names - a
; path is what lets the mod bake the value into the class. `roots` REPLACES the default list;
; `extraRoots` adds to it, which is what you want for one more widget.
;
; The skip button - "(button) Skip", bottom left - in dialogue, cutscenes and videos. Not inside
; the HUD, so it has to be a root of its own to be reachable. Section is [WBP_SkipButton] below.
; The dialogue options box lives inside WBP_Dialogue, which is a menu and left alone while
; tweakMenus = false, so it is reached as a root of its own. Section is [WBP_Dialogue_ChoiceBox].
extraRoots = \
  /Game/_Dawnwalker/UI/_Unified/BaseWidgets/WBP_SkipButton.WBP_SkipButton_C, \
  /Game/_Dawnwalker/UI/_Unified/Dialogues/WBP_Dialogue_ChoiceBox.WBP_Dialogue_ChoiceBox_C
;
; roots = \
;   /Game/_Dawnwalker/UI/_Unified/HUD/WBP_GameHUD.WBP_GameHUD_C, \
;   /Game/_Dawnwalker/UI/_Unified/HUD/Compass/WBP_Compass_Mappin.WBP_Compass_Mappin_C, \
;   /Game/_Dawnwalker/UI/_Unified/HUD/Notifications/WBP_NotificationPanel_Toast_Entry.WBP_NotificationPanel_Toast_Entry_C
;
; The full default list, which you do not have to write out to use:
;   WBP_GameHUD_C                              the entire HUD
;   WBP_Compass_Mappin_C                       one compass pin
;   WBP_CompassHeading_C                       N / E / S / W on the compass
;   WBP_NotificationPanel_Toast_Entry_C        one toast
;   WBP_CombatTargetIndicator_C                the marker over your target
;   WBP_CombatCharacterBar_C                   an enemy's health bar
;   WBP_Combat_AttackWarning_C                 the incoming-attack flash
;   WBP_CombatNotifications_C                  parried / critical / etc
;   WBP_InteractablePrompt_C                   "hold E to ..."
;   WBP_InteractablePrompt_AbilityVariant_C    the ability version of the same
;   WBP_DIS_Prompt_New_C
;   WBP_HUD_LootingPanel_C                     the loot list
;   WBP_HUD_Readable_C                         notes and letters
;   WBP_BOIPOIWidget_C                         investigation points of interest
;   WBP_FocusRevelaedMarker_C                  a focus-revealed marker in the world
;   WBP_GameplayDialogue_OverheadSubtitle_C    subtitles over an NPC's head
;   WBP_MediumTutorialPopup_C                  tutorial card
;   WBP_QuestLevelSequenceOverlay_C


; ---- MENUS -----------------------------------------------------------------------------------
; The hub tabs, the map, pause, settings, dialogue and the loading screen.
;
; OFF, and deliberately: this is what makes [All] mean "the in-game HUD" rather than "every piece
; of UI in the game". With it on, [All] scale = 0.9 shrinks the pause menu and the map as well,
; which is almost never what anyone means by "all". Turn it back on only if you actually want to
; move or resize a full-screen screen, and then write a per-screen section rather than using [All].
tweakMenus = false

; The screens themselves. Unlike a lot of games, Dawnwalker keeps its hub screens loaded rather
; than streaming each one in as you open it, so these are real class paths and get the same
; treatment the HUD does. The /Script/ entries at the end are native parents, there to catch
; anything not loaded when this list was written.
;
; menuRoots = \
;   /Game/_Dawnwalker/UI/_Unified/GameHub/Map/WBP_Map.WBP_Map_C, \
;   /Game/_Dawnwalker/UI/_Unified/PauseMenu/WBP_PauseMenu.WBP_PauseMenu_C
;
; The defaults:
;   WBP_Hub_Journal_C                 journal / quests
;   WBP_Map_C                         map
;   WBP_Hub_NewInventory_C            inventory
;   WBP_Hub_CharacterDevelopment_C    skills and traits
;   WBP_Hub_ActiveAbilities_C         abilities and quickslots
;   WBP_Hub_Crafting_C                crafting
;   WBP_Hub_Court_C                   the court
;   WBP_Hub_Glossary_C                glossary
;   WBP_PauseMenu_C                   pause
;   WBP_Settings_C                    settings
;   WBP_Dialogue_C                    dialogue
;   WBP_LoadingScreen_C               loading screen
;   /Script/DogwoodUI.DWHUBWidgetBase     the frame the hub tabs sit in
;   /Script/DogwoodUI.MapWidget
;   /Script/DogwoodUI.MainMenuBase
;   /Script/DogwoodUI.TitleScreen
;   /Script/DogwoodUI.CreditsWindowBase
;   /Script/DogwoodUI.SaveWindowBase
;   /Script/DogwoodUI.ComicViewerWidget
;   /Script/DogwoodUI.CinematicDialogueWidget


; ---- TUNING (you almost certainly do not need to touch these) ---------------------------------
; maxDepth          = 24     ; how far down the widget tree to walk
; maxWidgets        = 4000   ; a ceiling on one pass, so a deep walk cannot run away
; hookNewWidgets    = true   ; catch widgets as they are created
; bakeClassDefaults = true   ; write your values onto the class, so new widgets are born tweaked
; reassert          = true   ; keep re-applying, in case the game writes over us
; reassertSeconds   = 2.0    ; how often the re-check runs. It only looks at what we wrote to.
;
; Write our values back the instant the game changes its HUD layout, instead of waiting for the
; re-check. The game swaps HUD presets when you enter focus, lock on, start combat: containers
; get shown/hidden and the widgets in them re-laid-out, which is what made WBP_OpenFocusPrompt
; flash back and WBP_HUD_Quickslots_ChangePrompt jump for up to 2s. These three are the functions
; that do it; a post-hook on each re-asserts everything this file holds right after.
;
; The last one is different in kind: it fires on a WIDGET, the moment one of its own animations
; ends. Several HUD elements animate their own render transform when they show or pulse - the
; quickslot change prompt slides in on every weapon draw - and the animation's last frame is
; where they stay until something writes them again. This puts your offset back that instant.
reassertAfter = \
  /Script/DogwoodUI.HUDManagerSubsystem:PushHUDPreset, \
  /Script/DogwoodUI.HUDManagerSubsystem:PopHUDPreset, \
  /Script/DogwoodUI.NamedToggleableContainer:SetShown, \
  /Script/UMG.UserWidget:OnAnimationFinished
; Hooks on a widget's own blueprint functions (tried on the quickslot change prompt: its named
; functions and even its ubergraph) never fired for the reset that widget gets on weapon draw -
; that reset is a UMG animation writing the transform directly, with no function to hook. The
; answer for an element the game animates is to move its unanimated PARENT instead; see the
; [Overlay_2/CommonVisualAttachment_0] section.
; sweepSeconds      = 0      ; periodic search for new widgets. 0 = off; the bake covers it.
; menuSweepSeconds  = 2.0    ; the same, for menus only
;
; identify              = ; blink an element on and off so you can see which one it is
; identifyBlinkSeconds  = 0.4
; elements              = ; give these the [All] values without writing a section for each


; ===========================================================================================
; AUTO-FADE  <- the HUD gets out of the way when nothing is happening
;
; Ten times a second this asks a few questions about what you are doing. If any of them says
; yes, the HUD is up. If none has said yes for idleAfterSeconds, it fades to idleOpacity.
;
; It is a MULTIPLIER on whatever else this file does, not a replacement, so [All] opacity = 0.8
; plus a fade to 0.3 lands on 0.24 and your own values keep meaning what they say. It never
; touches Visibility, so nothing moves and nothing stops taking input - a faded HUD is still
; there, just invisible. And it never fades a menu: a screen you opened is not idle.
;
; It cannot fade what it cannot see happening. Every signal below is read out of the game's own
; classes, and when one of them cannot be read it is named in UE4SS.log at startup and switched
; off rather than silently counted as "nothing is happening". If the HUD is not coming up when
; it should, that log line is the first place to look.
; ===========================================================================================

[AutoFade]
checkSeconds = 0.5

enabled          = true

idleAfterSeconds = 2.0     ; how long nothing must happen before it starts fading
idleOpacity      = 0.0     ; where it fades to. 0 = gone, 0.25 = a ghost you can still read
fadeOutSeconds   = 1.6     ; slow on the way out, so it is not distracting
fadeInSeconds    = 0.8     ; half the fade-out: quick enough to be there when you need it,
                           ; slow enough to read as a fade rather than a pop

; How often the fade MOVES, as opposed to how often it looks (checkSeconds, further down).
; These are two different jobs and they want two different rates: ten looks a second is
; plenty for noticing that you drew a weapon, and nowhere near enough to draw a fade - at
; that rate an 0.8s fade is eight visible bands. 0.016 is about 60 a second. It only ticks
; this fast while the fade is actually moving; the rest of the time it drops back to
; checkSeconds, because by then the only thing left to do is ask the probes.
fadeStepSeconds  = 0.008   ; the floor the mod allows. ExecuteWithDelay is not exact, so asking
                           ; for 8ms lands nearer a real 16ms step than asking for 16 does.

; HOW SMOOTH IT CAN GET - measured, not assumed. With debugLogging on, every fade prints one line:
;   fade to 0.00: N steps over Xs (avg gap, worst, our cost per step - of which probes / push,
;   driver, chains)
; The first measurements showed 4 steps per fade with "our cost 146ms/step": the fade was slow
; because the PROBES (the showWhenVisible widget searches) ran inside every ease step. They now
; run on their own 100ms chain, and the ease steps - an opacity write per held widget - run on
; separate chains at fadeStepSeconds. Read that line before touching anything below.
; Independent ease chains stepping the same fade while it moves. If the "avg gap" is still
; well above fadeStepSeconds, more chains interleave and give more steps. 1..8.
fadeChains = 2
frameHook = \
  /Game/_Dawnwalker/UI/_Unified/HUD/CombatFocus/WBP_HUD_Combat_RadialFocusPanel.WBP_HUD_Combat_RadialFocusPanel_C:Tick, \
  /Game/_Dawnwalker/UI/_Unified/HUD/GameplayDialogue/WBP_GameplayDialogue_HUD.WBP_GameplayDialogue_HUD_C:Tick, \
  /Game/_Dawnwalker/Blueprints/Lighting/TimeOfDay/Blueprints/BP_SkyRotator.BP_SkyRotator_C:ReceiveTick

peekKey          = F10     ; hold the HUD up for a few seconds without turning anything off
peekSeconds      = 4.0

; ---- what counts as "something is happening" -------------------------------------------------
; Each of these is read off the player or the world. Turn one off and that signal stops
; counting; the rest keep working.

showInCombat     = true    ; the game's own combat state (CombatSubsystem)
showWeaponDrawn  = true    ; you are in a fighting stance - this comes up BEFORE combat does
showWhenLockedOn = true    ; you are locked on to a target
showInFocusMode  = true    ; focus mode: planning abilities, or executing the plan
showWhenAiming   = true    ; aiming with LT. Actually FIRING a shadowstep (RT) does not count -
                           ; that is a teleport, not an aim - so it does not bring a faded HUD
                           ; back outside combat. In combat showInCombat holds it anyway.
shadowstepSeconds = 1.5    ; how long after a step fires it still counts as "executing"

; A signal has to stay true this long before it counts. 0 = instant. This is the safety net for
; a shadowstep: it trips aim / focus / lock-on for well under a second, and nothing in the game
; says "that was a teleport" reliably enough to filter it by name - so outlast it instead. LT
; held or focus mode entered on purpose is still there a second later; a step is not. Combat
; itself stays instant.
showWhenAimingAfter   = 0.5
showInFocusModeAfter  = 0.5
showWhenLockedOnAfter = 0.5
showWeaponDrawnAfter  = 0.3   ; drawing a weapon should feel immediate; 0.3s still eats a blip
showWhenHurt     = false    ; health or stamina is not full
showOnStatChange = true    ; health or stamina just moved, however briefly

;
; ---- if the HUD never fades ------------------------------------------------------------------
; That is this feature's one real failure mode, and it means a signal above is stuck reporting
; activity. It is not subtle from the outside - the mod looks like it is not loaded at all - so
; it says so itself: after about 20 seconds without a single fade it prints one line in
; UE4SS.log naming what is holding the HUD up. Set debugLogging = true in [General] and it prints
; that line every time it changes instead.
;
; The three worth suspecting first, in order:
;   showWeaponDrawn   - if the game keeps a combat mode set at all times rather than only when
;                       your weapon is out, this is true forever.
;   showWhenHurt      - if a stat never quite reads as full, this is true forever. Try lowering
;                       hurtBelow to 0.95, or turn it off.
;   showOnStatChange  - stamina regenerates continuously, so this needs a threshold rather than
;                       "did it move" - that is statChangeBy below.
;
; Turn the suspect off, press F7, and see if it fades. F7 re-reads this file; you do not need to
; restart the game to try one.

; Not exactly 1.0: a bar that regenerates sits a hair under full for a long time, and a strict
; "less than full" would hold the HUD up through all of it.
hurtBelow        = 0.995
; Stamina is spent by the most ordinary things you do outside combat - sprint, dodge, SHADOWSTEP -
; and each one dropped the bar and brought the whole HUD back for the refill. So by default only
; HEALTH counts for showWhenHurt and showOnStatChange. Turn either on to have stamina count too.
hurtIncludesStamina       = false
statChangeIncludesStamina = false

; How far health or stamina has to move to count as something happening. 0.02 is 2% of a bar.
; Too small and continuous stamina regeneration counts as activity on every single tick, which
; means the HUD never fades at all.
statChangeBy     = 0.02

; ---- and these being on screen ---------------------------------------------------------------
; Any widget class named here keeps the HUD up while one of them is visible. This is the list
; to edit if something ought to hold the HUD up and does not - press F9 with it on screen to
; find out what it is really called. A name that is simply never on screen costs nothing.
;
; Set explicitly here rather than left to the default, because three names had to come out.
; WBP_InteractablePrompt_AbilityVariant_C, WBP_HUD_Readable_C and
; WBP_NotificationPanel_Toast_Entry_C turned out to exist ALL THE TIME rather than only while
; they have something to show, so they reported "on screen" permanently and the HUD never
; faded once. Add one back if you want to see whether it behaves now - the log names whatever
; is holding the HUD up.

; WBP_InteractablePrompt_C ("talk to / hold E") is deliberately NOT in this list: a prompt should
; stay readable on a faded HUD rather than keep the whole HUD up. It is never faded - see exclude.
showWhenVisible = \
  WBP_DIS_Prompt_New_C, \
  WBP_HUD_LootingPanel_C, \
  WBP_MediumTutorialPopup_C, \
  WBP_Dialogue_C

; ---- WHAT gets faded -------------------------------------------------------------------------
; By default the fade holds each TOP-LEVEL widget, which here means WBP_GameHUD - the whole HUD
; in a single write, everything inside it going together.
;
; That default cannot keep one piece of the HUD visible, and it is worth knowing why rather than
; fighting it: opacity MULTIPLIES down the widget tree. Fade WBP_GameHUD to zero and the compass
; inside it is zero too, whatever you say about the compass - zero times anything is zero. A
; child cannot be rescued from its parent.
;
; So name the pieces instead. With fadeElements set, the fade holds exactly these, wherever they
; sit in the tree, and leaves everything else alone. Below is the whole HUD MINUS the compass,
; which is "fade everything except the compass". Delete a name to keep that piece up; * works,
; so WBP_HUD_* is a shortcut.
;
; The compass pins and heading are separate top-level widgets and are not listed either, so the
; compass stays complete. Toasts, combat indicators and interaction prompts are not listed
; because they only exist while something is happening, which is exactly when the HUD is up.

fadeElements =   Crosshair, HumanStats, VampireStats, XPBar, WBP_HudTimer,   WBP_HUD_QuestInfo, WBP_HUD_Quickslots, WBP_AA_Quickslots, WBP_HUD_Quickslots_ChangePrompt,   WBP_BuffContainer, WBP_ControlsLegend, WBP_InputPrompt, WBP_SecondInputPrompt,   WBP_GameplayDialogue_HUD, WBP_CustomProgressBar,   BossBar, CombatFocusPanel, WBP_HUD_FocusCharge_Bar, WBP_HUD_SpecialAttackCooldown,   WBP_HUD_AbilityCooldownsContainer, WBP_HUD_MagicShield, WBP_OpenFocusPrompt,   WBP_HUD_IncomingHelperDamageIndicator, WBP_AmbrusShieldTimer, XantheBossfightTimer

; Leave fadeElements blank to go back to "the whole HUD as one thing".

; ---- what to leave alone ---------------------------------------------------------------------
; Names or wildcards, matched the same way a section header is. Anything here is never faded,
; whichever of the two modes above is in use. Only useful for taking one name back out of a
; fadeElements list you otherwise like - a wildcard plus an exception.
;
; The focus radial and its charge bar hide themselves by opacity, not visibility, so a fade that
; puts their "vanilla" opacity back leaves a closed radial on screen until you press the key again.
; Both are out of the fade for that reason; they sit at 0 whenever they are not in use anyway.
; WBP_InputPrompt / WBP_SecondInputPrompt are the HUD's own prompt lines ("Talk to ...", "hold E").
; They are what you actually read, so they stay up while the rest fades. exclude beats fadeElements.
; WBP_NotificationPanel: toasts fade themselves in and out; a notification is news, and news
; should not arrive already dimmed because the rest of the HUD happens to be idle.
exclude = CombatFocusPanel, WBP_HUD_FocusCharge_Bar, WBP_InteractablePrompt_C, \
          WBP_InputPrompt, WBP_SecondInputPrompt, WBP_NotificationPanel

; checkSeconds = 0.1    ; how often it looks. This is the only thing in the whole mod that runs
;                       ; on a clock while you play. The player-state signals are a few property
;                       ; reads on objects it already holds and cost nothing; the showWhenVisible
;                       ; list is one widget search each, which is cheap because UObjectCacheMod
;                       ; is installed alongside. If you ever remove that mod, raise this to 0.25
;                       ; or trim the list.


; ===========================================================================================
; [All] is every TOP-LEVEL widget: the whole HUD as one thing, plus each of the loose widgets
; the game creates outside it, plus - while tweakMenus is on - each screen.
;
;   [All]
;   opacity = 0.8      ; the entire UI at 80%
;
; It stops at the top level on purpose. Opacity, brightness and scale all multiply down the
; widget tree, so applying them to every widget instead would fade a four-deep element to 0.41
; and a ten-deep one to 0.11 - the deeper something is drawn, the more it would be affected,
; which is nobody's idea of "all". At the top level each thing is touched exactly once.
;
; A section of an element's own always wins over [All].
;
; brightness works here too, and this is the nicest place for it - the whole UI a stop darker
; without fading anything into the scene behind it:
;
;   [All]
;   brightness = 0.75
; ===========================================================================================

; NOTE: [All] reaches menus too while tweakMenus = true above, so scale here shrinks the map and
; the hub screens as well. If that is not what you want, either set tweakMenus = false or move
; these two lines into a [WBP_GameHUD] section, which is the HUD and nothing else.

[All]
opacity = 0.8
scale   = 1
; brightness = 0.8


; ===========================================================================================
; YOUR HUD  <- THIS IS THE PART YOU EDIT
;
; Add a section named after a HUD element, then set any of these on it:
;
;   offsetX / offsetY      move it. +Y is DOWN. Use offsetXAdd / offsetYAdd to add to the
;                          game's own value instead of replacing it.
;   scale                  resize it. 0.8 = 20% smaller, 1.25 = 25% bigger.
;   scaleX / scaleY        resize one axis only. scaleMul multiplies the game's own scale.
;   opacity                0.0 invisible, 1.0 normal. opacityMul multiplies the game's own.
;   brightness             how bright it is. 1.0 is the game's own, 0.5 darkens it by half,
;                          1.5 brightens. Not the same key as opacity - see below.
;   visible = false        hide it completely.
;   angle / pivotX / pivotY   rotate it, and set what it rotates and scales around.
;   enabled = false        ignore a section without deleting it.
;   force = true           re-push opacity and visibility every 0.05s, for something the game
;                          keeps re-showing. Costs a little; only use it where you need it.
;   reassert = false       write once and then leave it alone. Use this on anything the game
;                          animates itself, so the two do not fight.
;
; Offsets are not raw pixels - the game's UI scale multiplies them - so a value tuned at one
; resolution still looks right at another. Scaling does not move neighbours out of the way.
;
; BRIGHTNESS vs OPACITY - they look similar and are not the same thing:
;   opacity fades the element towards whatever is behind it, so a dimmed element takes on the
;   colour of the scene under it and gets harder to read against a busy background.
;   brightness scales the element's own colour instead. It stays just as solid, it just goes
;   darker or lighter. For toning a HUD down without losing legibility this is usually the one
;   you want - and the two combine, so opacity = 0.8 with brightness = 0.7 is both.
;
;   1.0 is the element's own colour, whatever that is - there is no palette to know about.
;   Below 1 darkens and always does something visible. Above 1 lifts everything the element
;   draws that is not already pure white, so a mostly-white element changes less than you
;   expect. Values above 10 are treated as 10.
;
;   It has no effect on an element with no colour of its own - most plain boxes and layout
;   panels. Set dumpWidgets = true: the lines that print a colour=(...) are the ones it works
;   on, and a top-level element's colour multiplies everything inside it.
;
; A section is matched against the element's name, then its class. * is a wildcard, so
; [WBP_HUD_*] catches a lot at once. A section that matched nothing is listed in the log as
; "nothing on screen matched" - a typo if the name is wrong, but also just what you get for an
; element that is not up at that moment (no boss bar with no boss). Those still get the value,
; through the bake.
;
; CAREFUL: a name like Tint or HealthBar is used inside more than one widget, so [Tint] would
; change several unrelated things. Prefer the names in the list below, and use identify = to
; check when you are not sure.
;
; FINDING NAMES: set dumpWidgets = true, load a save, and look in UE4SS.log for
; "---- HUD widgets ----". Every line there is one element and its current values, and the name
; at the start is what goes in [brackets].
; ===========================================================================================


; ---- the whole HUD ---------------------------------------------------------------------------
; One widget holds all of it, so this is the one section that means "the HUD" and nothing else.
; [WBP_GameHUD]
; scale      = 0.9
; opacity    = 0.9
; brightness = 0.8


; ---- health, stamina, blood ------------------------------------------------------------------
; The HUD carries two stat panels and shows whichever form you are in.
[HumanStats]             ; the human panel: health + stamina
opacity = 0.8
scale = 0.7
offsetY = 100
offsetX = -100
; offsetX = -30
; scale   = 0.9
[VampireStats]           ; the vampire panel: blood + overdrink + stamina
opacity = 0.8
scale = 0.7
offsetY = 100
offsetX = -100
;
; pieces of them, if you want them separately:
; [HPBar]                  ; health bar inside HumanStats
; [Stamina]                ; the stamina block in either panel
[OverdrinkBar]           ; vampire overdrink
opacity = 0.8
scale = 0.7
offsetY = 50
offsetX = 0
[WBP_HUD_VampireMutation]
opacity = 0.8
scale = 0.7
offsetY = 50
offsetX = 100
; [XPBar]                  ; the experience bar
[WBP_HUD_XPBar]
opacity = 0.8
scale = 0.8
offsetY = 100
offsetX = -70
; [WBP_CustomProgressBar]  ; the quest-driven progress bar


; ---- crosshair and combat --------------------------------------------------------------------
; [Crosshair]
; scale   = 0.7
; opacity = 0.8
