; The quickslot change prompt slides in on every weapon draw: a UMG animation writes its render
; transform directly, so any offset put on the prompt itself is reset to the animation's pose and
; only comes back on the re-check. The offset therefore goes on the wrapper AROUND it, which the
; game never animates - the prompt slides inside it, at your position. The wrapper's name is
; generic, so the header spells out its ancestors: the widget called CommonVisualAttachment_0
; whose parent is Overlay_2 whose parent is QuickslotContainer, and no other.
; ALL of the prompt's position goes here and none on the prompt. An offset on the prompt itself is
; undone by its slide-in animation on every weapon draw, and stays undone until the next F7.
; Note the wrapper's scale multiplies a child offset: -240/200 written on the prompt inside a
; 0.6 wrapper showed as about -144/+120 on screen, which is what the values below reproduce.
; Move it with THESE two numbers.
[QuickslotContainer/Overlay_2/CommonVisualAttachment_0]
opacity = game           ; the wrapper's opacity is not ours to write
scale = 0.6
offsetX = -74
offsetY = 170

[WBP_HUD_Quickslots_ChangePrompt]
; Faded like every other element. Offsets are explicitly ZERO and must stay zero: the game's
; slide-in resets this widget's own position on every draw, so anything else put here is lost
; until F7. Position it with the wrapper section above. reassert = false so the 2s re-check does
; not snap the slide mid-way - which also means anything written here is written only once.
opacity = 0.7
scale = 0.9
offsetX = 0
offsetY = 0
reassert = false
[WBP_BuffContainer]      ; buff and debuff icons
