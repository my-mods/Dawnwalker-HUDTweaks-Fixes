; ---- the game's own show/hide groups ---------------------------------------------------------
; These are NamedToggleableContainer widgets: the game's own HUD groups, which it shows and
; hides by itself as you move between combat, dialogue and drinking blood. You can name them
; like anything else, but prefer the widget INSIDE one - putting your value on the container
; means fighting the game for it every time it switches groups.
